<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddb972"/>
      <stop offset="100%" stop-color="#a97f38"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c69a4e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c69a4e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="900" height="620" fill="url(#navyBg)"/>
  <rect width="900" height="620" fill="url(#dots)"/>
  <circle cx="640" cy="210" r="260" fill="url(#glow)"/>

  <!-- decorative concentric rings behind the scales -->
  <circle cx="650" cy="190" r="185" fill="none" stroke="#c69a4e" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="650" cy="190" r="145" fill="none" stroke="#c69a4e" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 10"/>

  <!-- Scales of justice, clean line-art -->
  <g transform="translate(650,110)" stroke="#ddb972" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="10" x2="0" y2="215"/>
    <path d="M-48 245 L48 245 L0 215 Z"/>
    <line x1="-58" y1="245" x2="58" y2="245"/>
    <line x1="-95" y1="30" x2="95" y2="30"/>
    <circle cx="0" cy="30" r="6" fill="#ddb972" stroke="none"/>
    <path d="M0 10 l-13 -17 h26 z" fill="#ddb972" stroke="none"/>
    <line x1="-95" y1="30" x2="-95" y2="80"/>
    <path d="M-135 80 a40 26 0 0 0 80 0 Z" fill="#0f1a2e" stroke="#ddb972" stroke-width="4"/>
    <line x1="95" y1="30" x2="95" y2="80"/>
    <path d="M55 80 a40 26 0 0 0 80 0 Z" fill="#0f1a2e" stroke="#ddb972" stroke-width="4"/>
  </g>

  <!-- document / checklist card -->
  <g transform="translate(170,180)">
    <rect x="0" y="0" width="190" height="240" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#c69a4e" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="26" y="34" width="90" height="10" rx="5" fill="#ddb972" opacity="0.85"/>
    <rect x="26" y="60" width="138" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="26" y="78" width="120" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
    <g transform="translate(26,104)">
      <circle cx="8" cy="8" r="8" fill="#c69a4e"/>
      <path d="M4.5 8 l3 3 l6 -6" stroke="#101a2e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="3" width="112" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
    </g>
    <g transform="translate(26,132)">
      <circle cx="8" cy="8" r="8" fill="#c69a4e"/>
      <path d="M4.5 8 l3 3 l6 -6" stroke="#101a2e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="3" width="98" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
    </g>
    <g transform="translate(26,160)">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#ddb972" stroke-width="1.4"/>
      <rect x="26" y="3" width="86" height="6" rx="3" fill="#ffffff" opacity="0.22"/>
    </g>
    <rect x="26" y="196" width="72" height="24" rx="12" fill="none" stroke="#ddb972" stroke-width="1.4"/>
    <text x="40" y="212" font-family="Arial, sans-serif" font-size="11" fill="#ddb972" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- floating shield-check badge -->
  <g transform="translate(730,410)">
    <circle cx="0" cy="0" r="46" fill="#101a2e" stroke="#c69a4e" stroke-width="2"/>
    <path d="M0 -20 L18 -12 V6 C18 20 8 28 0 32 C-8 28 -18 20 -18 6 V-12 Z" fill="none" stroke="#ddb972" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-8 0 l6 6 l12 -14" fill="none" stroke="#ddb972" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- connecting dotted lines -->
  <path d="M360 280 C 430 260, 480 250, 540 210" fill="none" stroke="#ddb972" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 8"/>
  <path d="M690 350 C 705 375, 715 390, 726 402" fill="none" stroke="#ddb972" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 8"/>

  <!-- bottom label -->
  <g transform="translate(90,530)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="26" fill="#ffffff" opacity="0.92">Compliance, Codified.</text>
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#ddb972">PAN-INDIA &#8226; ADVOCATE-LED &#8226; 20+ YEARS</text>
  </g>
</svg>

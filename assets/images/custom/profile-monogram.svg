<svg viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pnavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2c4d"/>
      <stop offset="60%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="pgold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d29c"/>
      <stop offset="50%" stop-color="#ddb972"/>
      <stop offset="100%" stop-color="#a97f38"/>
    </linearGradient>
    <pattern id="pdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="640" height="720" fill="url(#pnavy)"/>
  <rect width="640" height="720" fill="url(#pdots)"/>

  <!-- corner ornament frame -->
  <g stroke="#c69a4e" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M40 100 V50 H90"/>
    <path d="M600 100 V50 H550"/>
    <path d="M40 620 V670 H90"/>
    <path d="M600 620 V670 H550"/>
  </g>

  <!-- decorative rings around monogram -->
  <circle cx="320" cy="330" r="168" fill="none" stroke="#c69a4e" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="320" cy="330" r="190" fill="none" stroke="#c69a4e" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="1 9"/>

  <!-- monogram -->
  <text x="320" y="365" font-family="'Playfair Display', Georgia, serif" font-size="150" font-weight="700"
        text-anchor="middle" fill="url(#pgold)">PK</text>

  <!-- small scale icon flourish above monogram -->
  <g transform="translate(320,205)" stroke="#ddb972" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="0" y2="34"/>
    <line x1="-30" y1="8" x2="30" y2="8"/>
    <circle cx="0" cy="8" r="3.4" fill="#ddb972" stroke="none"/>
    <path d="M-42 26 a12 8 0 0 0 24 0 Z" fill="#0f1a2e" stroke="#ddb972" stroke-width="2.4"/>
    <path d="M18 26 a12 8 0 0 0 24 0 Z" fill="#0f1a2e" stroke="#ddb972" stroke-width="2.4"/>
    <line x1="-30" y1="8" x2="-30" y2="18"/>
    <line x1="30" y1="8" x2="30" y2="18"/>
  </g>

  <!-- gold rule -->
  <line x1="250" y1="460" x2="390" y2="460" stroke="#c69a4e" stroke-width="2"/>

  <!-- name + role -->
  <text x="320" y="505" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700"
        text-anchor="middle" fill="#ffffff">Pankaj Kumar</text>
  <text x="320" y="535" font-family="Arial, sans-serif" font-size="14" letter-spacing="2.5"
        text-anchor="middle" fill="#ddb972">ADVOCATE &amp; PRINCIPAL CONSULTANT</text>

  <!-- credentials row -->
  <text x="320" y="580" font-family="Arial, sans-serif" font-size="12.5" letter-spacing="0.5"
        text-anchor="middle" fill="#ffffff" opacity="0.55">Corporate Governance &#8226; Labour Law &#8226; 20+ Years</text>
</svg>
